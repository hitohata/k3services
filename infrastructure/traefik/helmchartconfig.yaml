apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        forwardedHeaders:
          trustedIPs:
            - 192.168.10.1/32
    providers:
      kubernetesIngress:
        # Stirling PDF's Ingress reaches the KEDA interceptor through a
        # same-namespace ExternalName Service.
        allowExternalNameServices: true
