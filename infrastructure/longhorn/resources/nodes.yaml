apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: n100
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  allowScheduling: true
  tags:
    - replicated-ssd
  disks:
    ssd:
      path: /var/lib/longhorn
      diskType: filesystem
      allowScheduling: true
      storageReserved: 68719476736
