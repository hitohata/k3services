apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: longhorn-storage-pilot
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-ssd-ha
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: longhorn-storage-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: longhorn-storage-pilot
  template:
    metadata:
      labels:
        app: longhorn-storage-pilot
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        storage.dejima.men/longhorn: "true"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - n100
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: docker.io/alpine:3.22.7
          command:
            - /bin/sh
            - -ec
            - exec sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # Intentionally unready until the operator initializes the marker.
          # Never recreate it at startup: an empty replacement volume must fail.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test "$(cat /data/marker)" = k3services-longhorn-pilot-v1
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: longhorn-storage-pilot
