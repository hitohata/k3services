apiVersion: v1
kind: Namespace
metadata:
  name: nfs-provisioner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-client-provisioner
  namespace: nfs-provisioner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfs-client-provisioner-runner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: run-nfs-client-provisioner
subjects:
  - kind: ServiceAccount
    name: nfs-client-provisioner
    namespace: nfs-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-client-provisioner-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-client-provisioner
  namespace: nfs-provisioner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nfs-client-provisioner
  template:
    metadata:
      labels:
        app: nfs-client-provisioner
    spec:
      serviceAccountName: nfs-client-provisioner
      containers:
        - name: nfs-client-provisioner
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PROVISIONER_NAME
              value: k8s-sigs.io/nfs-subdir-external-provisioner
            - name: NFS_SERVER
              value: 192.168.10.100
            - name: NFS_PATH
              value: /Pi-NAS
          volumeMounts:
            - name: nfs-client-root
              mountPath: /persistentvolumes
      volumes:
        - name: nfs-client-root
          nfs:
            server: 192.168.10.100
            path: /Pi-NAS
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
---
# Nextcloud uses dedicated directories beneath /Pi-NAS/nextcloud without
# changing the path pattern used by other nfs-client PVCs.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client-nextcloud
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner
parameters:
  pathPattern: "nextcloud/${.PVC.name}"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
---
# Mealie uses dedicated directories beneath /Pi-NAS/mealie.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client-mealie
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner
parameters:
  pathPattern: "mealie/${.PVC.name}"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
---
# Vaultwarden backups use a dedicated directory beneath /Pi-NAS/vaultwarden.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client-vaultwarden
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner
parameters:
  pathPattern: "vaultwarden/${.PVC.name}"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
---
# Forgejo backups use a dedicated directory beneath /Pi-NAS/forgejo.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client-forgejo
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner
parameters:
  pathPattern: "forgejo/${.PVC.name}"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
