apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-mealie
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mealie-postgresql-backup
spec:
  schedule: "45 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: n100
          containers:
            - name: postgresql-dump
              image: postgres:18.6
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  export PGPASSWORD="$(cat /credentials/password)"
                  backup_file="/backups/mealie-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --host=mealie-postgresql --username="$(cat /credentials/username)" --no-owner mealie | gzip > "$backup_file"
                  find /backups -type f -name 'mealie-*.sql.gz' -mtime +13 -delete
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: credentials
              secret:
                secretName: mealie-postgresql-credentials
            - name: backups
              persistentVolumeClaim:
                claimName: mealie-backups
