# Existing NixOS media is deliberately mounted directly. Do not replace this
# PV with a dynamically provisioned claim: that would create a new directory
# and Immich would no longer find the existing assets.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4
  nfs:
    server: 192.168.10.100
    path: /Pi-NAS/immich/storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-library
  resources:
    requests:
      storage: 1Ti
---
# NixOS writes pg_dump output here. Keeping it mountable in Kubernetes allows
# the final source dump to be restored without copying the archive elsewhere.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-db-backups
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4
  nfs:
    server: 192.168.10.100
    path: /Pi-NAS/immich/db_backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-db-backups
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgresql
spec:
  serviceName: immich-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-postgresql
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: n100
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          # PostgreSQL 18 matches the NixOS source database. The image includes
          # the pgvector and VectorChord extensions Immich requires.
          image: ghcr.io/immich-app/postgres:18-vectorchord0.5.3-pgvector0.8.1
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-credentials
                  key: db-password
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            # PostgreSQL 18 otherwise defaults to a versioned directory outside
            # this PVC mount. Keep its cluster data on the local-path claim.
            - name: PGDATA
              value: /var/lib/postgresql/data
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --username=postgres
                - --dbname=immich
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - --username=postgres
                - --dbname=immich
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          # The upstream entrypoint starts as root to prepare PGDATA and its
          # runtime socket directory, then drops to the postgres user itself.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: immich-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
          args:
            - valkey-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Starting as the image's Valkey user avoids its entrypoint needing
            # CAP_SETUID, which is intentionally dropped above.
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
spec:
  selector:
    app.kubernetes.io/name: immich-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
# The HTTP add-on keeps an interceptor available while machine learning is at
# zero replicas. Immich sends ML requests to this Service rather than directly
# to the target Service, allowing KEDA to wake the worker on demand.
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning-keda-proxy
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
    - name: http
      port: 8080
      protocol: TCP
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: immich-machine-learning
spec:
  target:
    service: immich-machine-learning
    port: 3003
  rules:
    - hosts:
        - immich-machine-learning-keda-proxy
  scalingMetric:
    concurrency:
      targetValue: 1
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: immich-machine-learning
spec:
  scaleTargetRef:
    name: immich-machine-learning
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 600
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: immich-machine-learning
