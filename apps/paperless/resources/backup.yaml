apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-paperless
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-postgresql-backup
spec:
  schedule: "15 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: n100
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgresql-dump
              image: postgres:18.6
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  export PGPASSWORD="$(cat /credentials/db-password)"
                  backup_file="/backups/paperless-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --host=paperless-postgresql --username="$(cat /credentials/db-username)" --no-owner paperless | gzip > "$backup_file"
                  find /backups -type f -name 'paperless-*.sql.gz' -mtime +13 -delete
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: credentials
              secret:
                secretName: paperless-credentials
            - name: backups
              persistentVolumeClaim:
                claimName: paperless-backups
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-document-export
spec:
  schedule: "45 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: n100
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: document-exporter
              image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
              command:
                - /bin/bash
                - -ec
              args:
                - document_exporter /usr/src/paperless/export --compare-checksums
              env:
                - name: PAPERLESS_REDIS
                  value: redis://paperless-valkey:6379
                - name: PAPERLESS_DBENGINE
                  value: postgresql
                - name: PAPERLESS_DBHOST
                  value: paperless-postgresql
                - name: PAPERLESS_DBPORT
                  value: "5432"
                - name: PAPERLESS_DBNAME
                  value: paperless
                - name: PAPERLESS_DBUSER
                  valueFrom:
                    secretKeyRef:
                      name: paperless-credentials
                      key: db-username
                - name: PAPERLESS_DBPASS
                  valueFrom:
                    secretKeyRef:
                      name: paperless-credentials
                      key: db-password
                - name: PAPERLESS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: paperless-credentials
                      key: secret-key
                - name: PAPERLESS_TIME_ZONE
                  value: America/Vancouver
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /usr/src/paperless/data
                - name: media
                  mountPath: /usr/src/paperless/media
                - name: export
                  mountPath: /usr/src/paperless/export
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
            - name: media
              persistentVolumeClaim:
                claimName: paperless-media
            - name: export
              persistentVolumeClaim:
                claimName: paperless-export
