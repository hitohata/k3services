apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-authentik
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-postgresql-backup
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: docker.io/library/postgres:17.11-trixie
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  archive="/backups/authentik-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --host=authentik-postgresql --username=authentik --format=plain authentik | gzip > "$archive"
                  find /backups -type f -name 'authentik-*.sql.gz' -mtime +13 -delete
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: authentik-credentials
                      key: AUTHENTIK_POSTGRESQL__PASSWORD
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: authentik-backups
