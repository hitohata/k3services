apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-navidrome
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: navidrome-database-backup
spec:
  schedule: "45 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: n100
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: database-backup
              image: docker.io/keinos/sqlite3:3.51.2
              imagePullPolicy: IfNotPresent
              command:
                - sqlite3
              args:
                - -uri
                - file:/data/navidrome.db?mode=ro
                - .backup /staging/navidrome.db
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: staging
                  mountPath: /staging
          containers:
            - name: archive
              image: docker.io/alpine:3.22.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  backup_dir="/backups/navidrome-$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir "$backup_dir"
                  cp /staging/navidrome.db "$backup_dir/navidrome.db"
                  find /backups -mindepth 1 -maxdepth 1 -type d -name 'navidrome-*' -mtime +13 -exec rm -rf {} +
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: staging
                  mountPath: /staging
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: navidrome-data
            - name: staging
              emptyDir: {}
            - name: backups
              persistentVolumeClaim:
                claimName: navidrome-backups
