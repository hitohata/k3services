apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-nginx
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops-nginx
  template:
    metadata:
      labels:
        app: gitops-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-nginx
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: gitops-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-nginx-ingress
  namespace: default
  annotations:
    ingress.class: traefik
spec:
  rules:
  - host: myapp.n100.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitops-nginx
            port:
              number: 80
