apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-iii-upload
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-iii
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: firefly-iii
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firefly-iii
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: n100
      containers:
        - name: firefly-iii
          image: docker.io/fireflyiii/core:version-6.7.9
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: https://firefly-iii.dejima.men
            - name: TZ
              value: Asia/Tokyo
            - name: TRUSTED_PROXIES
              value: "**"
            - name: COOKIE_SECURE
              value: "true"
            - name: LOG_CHANNEL
              value: stdout
            - name: MAIL_MAILER
              value: log
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: firefly-iii-postgresql
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: firefly
            - name: DB_USERNAME
              value: firefly
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-credentials
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-credentials
                  key: DB_PASSWORD
            - name: STATIC_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-credentials
                  key: STATIC_CRON_TOKEN
            - name: SITE_OWNER
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-credentials
                  key: SITE_OWNER
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: upload
              mountPath: /var/www/html/storage/upload
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: firefly-iii-upload
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-iii
spec:
  selector:
    app.kubernetes.io/name: firefly-iii
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly-iii
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: firefly-iii-firefly-iii-public-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: firefly-iii.dejima.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly-iii
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: firefly-iii-public-https
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      X-Forwarded-Port: "443"
