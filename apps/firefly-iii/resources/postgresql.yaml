apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-iii-postgresql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-iii-postgresql-init
data:
  01-firefly.sh: |
    #!/bin/bash
    set -e
    psql --username "$POSTGRES_USER" --dbname postgres --set=ON_ERROR_STOP=1 --set=app_password="$DB_PASSWORD" <<'SQL'
    CREATE USER firefly WITH PASSWORD :'app_password';
    CREATE DATABASE firefly OWNER firefly;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-iii-postgresql
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: firefly-iii-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firefly-iii-postgresql
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: n100
      containers:
        - name: postgresql
          image: docker.io/library/postgres:17.11-trixie
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-credentials
                  key: postgres-password
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-iii-credentials
                  key: DB_PASSWORD
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, postgres]
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-iii-postgresql
        - name: init
          configMap:
            name: firefly-iii-postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-iii-postgresql
spec:
  selector:
    app.kubernetes.io/name: firefly-iii-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
