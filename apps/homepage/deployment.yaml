apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Home
    headerStyle: boxedWidgets
    target: _blank
    statusStyle: dot
    layout:
      Productivity:
        style: row
        columns: 4
      Media:
        style: row
        columns: 4
      Development:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
  services.yaml: |
    - Productivity:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.dejima.men
            description: Files and collaboration
        - Mealie:
            icon: mealie.png
            href: https://mealie.dejima.men
            description: Recipes and meal planning
        - Paperless:
            icon: paperless.png
            href: https://paperless.dejima.men
            description: Document archive
        - Linkwarden:
            icon: linkwarden.png
            href: https://linkwarden.dejima.men
            description: Bookmark archive
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vaultwarden.dejima.men
            description: Password manager
        - Stirling PDF:
            icon: stirling-pdf.png
            href: https://stirling-pdf.dejima.men
            description: PDF tools
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.dejima.men
            description: Media server
    - Development:
        - Forgejo:
            icon: forgejo.png
            href: https://forgejo.dejima.men
            description: Source code hosting
        - IT-Tools:
            icon: it-tools.png
            href: https://it-tools.dejima.men
            description: Utilities for developers
    - Infrastructure:
        - Netdata:
            icon: netdata.png
            href: https://netdata.dejima.men
            description: System monitoring
  bookmarks.yaml: |
    - Administration:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.dejima.men
            description: GitOps deployments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.dejima.men,homepage.n100.lan
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: homepage
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  selector:
    app.kubernetes.io/name: homepage
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: homepage.dejima.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
    - host: homepage.n100.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  name: http
