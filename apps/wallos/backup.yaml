apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallos-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-wallos
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wallos-backup
spec:
  schedule: "0 5 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: n100
          securityContext:
            runAsNonRoot: true
            runAsUser: 82
            runAsGroup: 82
            fsGroup: 82
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: database-backup
              image: docker.io/keinos/sqlite3:3.54.1
              imagePullPolicy: IfNotPresent
              command:
                - sqlite3
              args:
                - -readonly
                - file:/db/wallos.db?mode=ro
                - .backup /staging/wallos.db
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: db
                  mountPath: /db
                  readOnly: true
                - name: staging
                  mountPath: /staging
          containers:
            - name: archive
              image: docker.io/alpine:3.24.3
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  backup_dir="/backups/wallos-$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir "$backup_dir"
                  cp /staging/wallos.db "$backup_dir/wallos.db"
                  tar -czf "$backup_dir/logos.tar.gz" -C /logos .
                  find /backups -mindepth 1 -maxdepth 1 -type d -name 'wallos-*' -mtime +13 -exec rm -rf {} +
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: staging
                  mountPath: /staging
                  readOnly: true
                - name: logos
                  mountPath: /logos
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: db
              persistentVolumeClaim:
                claimName: wallos-db
            - name: logos
              persistentVolumeClaim:
                claimName: wallos-logos
            - name: staging
              emptyDir: {}
            - name: backups
              persistentVolumeClaim:
                claimName: wallos-backups
