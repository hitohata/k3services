apiVersion: v1
kind: ServiceAccount
metadata:
  name: wud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wud-reader
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wud-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wud-reader
subjects:
  - kind: ServiceAccount
    name: wud
    namespace: wud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wud-store
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wud
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wud
    spec:
      serviceAccountName: wud
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: n100
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wud
          image: docker.io/getwud/wud:9.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: America/Vancouver
            - name: WUD_AUTH_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: wud-credentials
                  key: admin-user
            - name: WUD_AUTH_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wud-credentials
                  key: admin-password
            - name: WUD_WATCHER_KUBERNETES_K3S_WATCHBYDEFAULT
              value: "true"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: store
              mountPath: /store
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: wud-store
---
apiVersion: v1
kind: Service
metadata:
  name: wud
spec:
  selector:
    app.kubernetes.io/name: wud
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wud
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: wud.dejima.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wud
                port:
                  name: http
    - host: wud.n100.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wud
                port:
                  name: http
