apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-pdf-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stirling-pdf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stirling-pdf
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: n100
      containers:
        - name: stirling-pdf
          image: ghcr.io/stirling-tools/stirling-pdf:2.14.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: America/Vancouver
            - name: SYSTEM_DEFAULTLOCALE
              value: en-CA
            - name: SYSTEM_MAXFILESIZE
              value: "100"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: native
          startupProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            failureThreshold: 36
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /configs
            - name: logs
              mountPath: /logs
            - name: temporary-files
              mountPath: /tmp/stirling-pdf
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: stirling-pdf-config
        - name: logs
          emptyDir: {}
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stirling-pdf
spec:
  selector:
    app.kubernetes.io/name: stirling-pdf
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stirling-pdf
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: stirling-pdf.dejima.men
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stirling-pdf
                port:
                  name: http
    - host: stirling-pdf.n100.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stirling-pdf
                port:
                  name: http
