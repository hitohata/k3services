# Netdata's parent retains cluster metrics, while a child DaemonSet collects
# host and container metrics from every node.
image:
  pullPolicy: IfNotPresent

# The persistence init container only fixes permissions on each child's
# node-local identity directory. Pin it instead of using the chart's `latest`.
initContainersImage:
  repository: alpine
  tag: "3.24.1"
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  # The chart otherwise defaults its legacy annotation to nginx, which
  # conflicts with the Traefik ingressClassName below on current Kubernetes.
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
  path: /
  pathType: Prefix
  hosts:
    - netdata.dejima.men
    - netdata.n100.lan
  spec:
    ingressClassName: traefik

# PodSecurityPolicy was removed from current Kubernetes releases.
rbac:
  create: false
  pspEnabled: false

serviceAccount:
  create: true
  name: netdata

# Disable the optional discovery sidecar so Netdata does not need permission to
# list Secrets or ConfigMaps across the cluster. Core node and workload metrics
# remain enabled through the child and Kubernetes-state collectors.
sd:
  image:
    pullPolicy: IfNotPresent
  child:
    enabled: false

parent:
  nodeSelector:
    kubernetes.io/hostname: n100
  claiming:
    enabled: false
  env:
    DO_NOT_TRACK: "1"
  # The image creates its telemetry opt-out marker in /etc/netdata at startup.
  # Keep the container non-root by providing that directory as a pod-local,
  # fsGroup-writable volume. The chart's ConfigMap subpath mounts still supply
  # the managed Netdata configuration files within it.
  extraVolumes:
    - name: netdata-config-directory
      emptyDir: {}
  extraVolumeMounts:
    - name: netdata-config-directory
      mountPath: /etc/netdata
  database:
    persistence: true
    storageclass: local-path
    volumesize: 15Gi
  alarms:
    persistence: true
    storageclass: local-path
    volumesize: 1Gi
  livenessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

child:
  claiming:
    enabled: false
  env:
    DO_NOT_TRACK: "1"
  # Netdata's script-discovery plugin watches this directory even when no
  # custom scripts are installed. Mount an empty directory so the watch does
  # not emit a "no such file or directory" error every minute.
  extraVolumes:
    - name: netdata-scripts-directory
      emptyDir: {}
  extraVolumeMounts:
    - name: netdata-scripts-directory
      mountPath: /etc/netdata/scripts.d
  configs:
    # K3s does not expose the deprecated insecure kube-proxy metrics endpoint
    # at 127.0.0.1:10249. Keep the collector configuration valid but give it
    # no jobs, avoiding repeated one-second scrape timeouts.
    kubeproxy:
      data: |
        jobs: []
  persistence:
    enabled: true
    hostPath: /var/lib/netdata-k8s-child
  livenessProbe:
    initialDelaySeconds: 20
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

k8sState:
  nodeSelector:
    kubernetes.io/hostname: n100
  claiming:
    enabled: false
  env:
    DO_NOT_TRACK: "1"
  persistence:
    enabled: true
    storageclass: local-path
    volumesize: 1Gi
  livenessProbe:
    initialDelaySeconds: 20
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

otel-collector:
  enabled: false
