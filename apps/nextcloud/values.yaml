replicaCount: 1

# Keep this stack off p51, whose local storage is an SD card. MariaDB's
# local-path PVC is therefore always provisioned on n100.
nodeSelector:
  kubernetes.io/hostname: n100

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  path: /
  pathType: Prefix

nextcloud:
  host: nextcloud.dejima.men
  trustedDomains:
    - nextcloud.dejima.men
    - nextcloud.n100.lan
  # This custom file replaces the chart's built-in file of the same name.
  defaultConfigs:
    reverse-proxy.config.php: false
  configs:
    reverse-proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => array (
          0 => '10.42.0.0/16',
          1 => '192.168.10.1',
        ),
      );
    public-url.config.php: |-
      <?php
      $CONFIG = array (
        'overwritehost' => 'nextcloud.dejima.men',
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://nextcloud.dejima.men',
      );
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

persistence:
  enabled: true
  # The chart stores its application files and configuration under this mount.
  # Keep it on n100's local disk: the image must chown these files during its
  # first start, an operation rejected by the NAS NFS root-squash export.
  existingClaim: nextcloud-config
  accessMode: ReadWriteOnce
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data
    accessMode: ReadWriteMany

# The initial application install can take several minutes.  While this probe
# runs, Kubernetes suppresses liveness and readiness failures.
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

internalDatabase:
  enabled: false
externalDatabase:
  enabled: true
  type: mysql
  host: nextcloud-mariadb
  database: nextcloud
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    passwordKey: mariadb-password

mariadb:
  enabled: true
  fullnameOverride: nextcloud-mariadb
  architecture: standalone
  auth:
    database: nextcloud
    username: nextcloud
    existingSecret: nextcloud-credentials
  primary:
    nodeSelector:
      kubernetes.io/hostname: n100
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 768Mi
    persistence:
      enabled: true
      storageClass: local-path
      accessModes:
        - ReadWriteOnce
      size: 20Gi

redis:
  enabled: true
  auth:
    enabled: true
    existingSecret: nextcloud-credentials
    existingSecretPasswordKey: redis-password
  master:
    nodeSelector:
      kubernetes.io/hostname: n100
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 192Mi
    persistence:
      enabled: false
  replica:
    replicaCount: 0
    persistence:
      enabled: false
externalRedis:
  enabled: true
  host: nextcloud-redis-master
  existingSecret:
    enabled: true
    secretName: nextcloud-credentials
    passwordKey: redis-password

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

extraManifests:
  # Preserve direct LAN access through the previous internal hostname.
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: nextcloud-lan
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
    spec:
      ingressClassName: traefik
      rules:
        - host: nextcloud.n100.lan
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: nextcloud
                    port:
                      name: http
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: nextcloud-config
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: nextcloud-data
    spec:
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nextcloud
      resources:
        requests:
          storage: 100Gi
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: nextcloud-backups
    spec:
      accessModes:
        - ReadWriteMany
      storageClassName: nfs-client-nextcloud
      resources:
        requests:
          storage: 20Gi
  - apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: nextcloud-db-backup
    spec:
      schedule: "30 2 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 3
      jobTemplate:
        spec:
          template:
            spec:
              restartPolicy: OnFailure
              nodeSelector:
                kubernetes.io/hostname: n100
              containers:
                - name: mariadb-dump
                  image: mariadb:11.8.6
                  command:
                    - /bin/sh
                    - -ec
                  args:
                    - |
                      export MYSQL_PWD="$(cat /credentials/mariadb-password)"
                      backup_file="/backups/nextcloud-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                      mariadb-dump --single-transaction --default-character-set=utf8mb4 --host=nextcloud-mariadb --user=nextcloud nextcloud | gzip > "$backup_file"
                      find /backups -type f -name 'nextcloud-*.sql.gz' -mtime +13 -delete
                  volumeMounts:
                    - name: credentials
                      mountPath: /credentials
                      readOnly: true
                    - name: backups
                      mountPath: /backups
              volumes:
                - name: credentials
                  secret:
                    secretName: nextcloud-credentials
                - name: backups
                  persistentVolumeClaim:
                    claimName: nextcloud-backups
