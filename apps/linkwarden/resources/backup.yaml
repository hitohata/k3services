apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-backups
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client-linkwarden
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkwarden-postgresql-backup
spec:
  schedule: "30 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: n100
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: postgresql-dump
              image: postgres:18.6
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  export PGPASSWORD="$(cat /credentials/db-password)"
                  backup_file="/backups/linkwarden-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --host=linkwarden-postgresql --username=linkwarden --no-owner linkwarden | gzip > "$backup_file"
                  find /backups -type f -name 'linkwarden-*.sql.gz' -mtime +13 -delete
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: credentials
                  mountPath: /credentials
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: credentials
              secret:
                secretName: linkwarden-credentials
            - name: backups
              persistentVolumeClaim:
                claimName: linkwarden-backups
