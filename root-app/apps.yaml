# keda
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.20.2
      helm:
        releaseName: keda
        valueFiles:
          - $values/apps/keda/keda-values.yaml
    - repoURL: https://github.com/hitohata/k3services
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The ScaledJob CRD exceeds Kubernetes' client-side apply annotation limit.
    # Server-side apply records field ownership without storing the full
    # manifest in kubectl.kubernetes.io/last-applied-configuration.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Avoid the client-side migration step, which would recreate the same
      # oversized last-applied annotation before server-side apply can run.
      - ClientSideApplyMigration=false
---
