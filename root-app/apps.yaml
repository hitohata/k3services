# immich
# The server is enabled after the completed NixOS migration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  # KEDA owns this Deployment's replica count. Ignoring only that field keeps
  # Argo CD self-heal from reversing KEDA scale-to-zero decisions.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: immich-machine-learning
      jsonPointers:
        - /spec/replicas
  sources:
    - repoURL: oci://ghcr.io/immich-app/immich-charts/immich
      targetRevision: 0.13.1
      path: .
      helm:
        releaseName: immich
        valueFiles:
          - $values/apps/immich/values.yaml
    - repoURL: https://github.com/hitohata/k3services
      targetRevision: HEAD
      ref: values
      path: apps/immich
    - repoURL: https://github.com/hitohata/k3services
      targetRevision: HEAD
      path: apps/immich/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
